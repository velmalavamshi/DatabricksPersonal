# The main pipeline for modern_dataengineeing

resources:
  pipelines:
    modern_dataengineeing_etl:
      name: modern_dataengineeing_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/modern_dataengineeing_etl"

      libraries:
        - glob:
            include: ../src/modern_dataengineeing_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
