# This is a Declarative Automation Bundle definition for modern_dataengineeing.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: modern_dataengineeing
  uuid: 16f391d8-6b1c-4b63-ab36-4106796a18cf

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-44df26f6-cd97.cloud.databricks.com
    variables:
      catalog: mde_dev
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-44df26f6-cd97.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/vamshialwayskush@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/vamshialwayskush@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mde_prd
      schema: prod
    permissions:
      - user_name: vamshialwayskush@gmail.com
        level: CAN_MANAGE
